name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

# Stacked pushes re-run the whole pipeline: keep only the latest run per
# ref so minutes are not spent verifying superseded commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: install frontend dependencies
        run: npm ci

      - name: test frontend
        run: npm test

      - name: build frontend
        run: npm run build

  backend:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1.0

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: check backend
        working-directory: src-tauri
        run: cargo check --locked

      - name: test backend
        working-directory: src-tauri
        run: cargo test --locked

      - name: rustfmt check
        working-directory: src-tauri
        run: cargo fmt --check

  scripts:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: compile check scripts
        run: python3 -m py_compile scripts/seed_problems.py scripts/import_pack.py scripts/export_pack.py
